<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - Mini Store Manager</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        nav {
            margin-bottom: 30px;
        }

        nav a {
            margin-right: 20px;
            text-decoration: none;
        }

        form {
            max-width: 600px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .error {
            color: #b00020;
            background: #ffe5e5;
            padding: 10px;
            margin-bottom: 20px;
        }

        .cancel {
            margin-left: 10px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('products.product_list') }}">Products</a>
    </nav>

    <h1>{{ title }}</h1>

    {% if errors %}
        <div class="error">
            <strong>Please fix the following:</strong>

            <ul>
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="POST">

        <label for="name">Product Name</label>
        <input
            type="text"
            id="name"
            name="name"
            value="{{ form.get('name', '') }}"
            required
        >

        <label for="description">Description</label>
        <textarea
            id="description"
            name="description"
        >{{ form.get('description', '') }}</textarea>

        <label for="category_id">Category</label>
        <select id="category_id" name="category_id" required>
            <option value="">-- Select Category --</option>

            {% for category in categories %}
                <option
                    value="{{ category.category_id }}"
                    {% if form.get('category_id', '')|string == category.category_id|string %}
                        selected
                    {% endif %}
                >
                    {{ category.name }}
                </option>
            {% endfor %}
        </select>

        <label for="price">Price</label>
        <input
            type="number"
            id="price"
            name="price"
            step="0.01"
            min="0"
            value="{{ form.get('price', '') }}"
            required
        >

        <label for="stock">Stock</label>
        <input
            type="number"
            id="stock"
            name="stock"
            min="0"
            value="{{ form.get('stock', '') }}"
            required
        >

        <button type="submit">Save Product</button>

        <a
            class="cancel"
            href="{{ url_for('products.product_list') }}"
        >
            Cancel
        </a>

    </form>

</body>
</html>
